[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py38"
line-length = 100
extend-include = ["git-worktree"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
